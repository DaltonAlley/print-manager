services:
  app:
    image: print-manager:local
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:/data/print-manager.db
      BIND_ADDR: 0.0.0.0:3000
      PRINT_MANAGER_DATA_ROOT: /data
      SHOP_TIME_ZONE: ${SHOP_TIME_ZONE:-America/New_York}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-104857600}
      RUST_LOG: ${RUST_LOG:-info}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
    ports:
      - "${PRINT_MANAGER_HOST:-127.0.0.1}:3000:3000"
    volumes:
      - ${PRINT_MANAGER_DATA_DIR:-./data}:/data
